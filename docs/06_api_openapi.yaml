openapi: 3.0.3
info:
  title: SnapPlant API
  description: 植物図鑑アプリ「SnapPlant」のREST API仕様書
  version: 1.0.0
  contact:
    name: SnapPlant Development Team
  license:
    name: MIT
    
servers:
  - url: https://func-snaplant-mk0w7s38.azurewebsites.net/api
    description: Production server (West Europe)

security:
  - FunctionKey: []

paths:
  /plants:
    get:
      summary: 植物一覧取得
      description: 登録済みの植物データを作成日時降順で取得
      tags:
        - Plants
      parameters:
        - $ref: '#/components/parameters/FunctionKey'
      responses:
        '200':
          description: 植物一覧の取得成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      plants:
                        type: array
                        items:
                          $ref: '#/components/schemas/PlantSummary'
                      total:
                        type: integer
                        description: 総件数
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

  /plants/save:
    post:
      summary: 植物新規登録
      description: |
        識別結果から選択した植物を図鑑に保存します。

        同じ `imagePath` を持つレコードが既に存在する場合は保存せず
        409 `IMAGE_ALREADY_SAVED` を返します（リトライの冪等性のため）。
        応答に既存レコードの `id` は含まないため、クライアントは
        `GET /plants` から該当レコードを探します。
      tags:
        - Plants
      parameters:
        - $ref: '#/components/parameters/FunctionKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantCreateRequest'
      responses:
        '201':
          description: 植物の登録成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      plant:
                        $ref: '#/components/schemas/Plant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

  /plants/{id}:
    get:
      summary: 植物詳細取得
      description: 指定されたIDの植物詳細情報を取得
      tags:
        - Plants
      parameters:
        - name: id
          in: path
          required: true
          description: 植物ID (UUID)
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/FunctionKey'
      responses:
        '200':
          description: 植物詳細の取得成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      plant:
                        $ref: '#/components/schemas/Plant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlantNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

    put:
      summary: 植物情報更新
      description: 既存植物の画像と信頼度を更新（重複時の画像置き換え）
      tags:
        - Plants
      parameters:
        - name: id
          in: path
          required: true
          description: 植物ID (UUID)
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/FunctionKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantUpdateRequest'
      responses:
        '200':
          description: 植物情報の更新成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      plant:
                        $ref: '#/components/schemas/Plant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlantNotFound'
        '409':
          description: |
            同じ `imagePath` のレコードがあり、そのどれも更新対象自身ではない。

            同じ `imagePath` のレコードが2つできると、一方の削除・更新で
            もう一方の画像まで消えるため、更新の入口で塞いでいる。
            更新対象自身が既にその画像を持っていれば通すので、`imagePath` を変えずに
            更新しても 409 にはならない。他に同じ画像のレコードが既に残っている場合も通す
            （既存の重複を理由に自分の更新を拒むと、その更新が永久にできなくなるため）。
            Cosmos DB 側の 409 はこのエンドポイントでは変換していないため 500 になる。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error:
                  code: "IMAGE_ALREADY_SAVED"
                  message: "この画像は既に保存されています"
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

    delete:
      summary: 植物削除
      description: |
        指定されたIDの植物を削除します。

        Cosmos DB のドキュメントを削除した後、`imagePath` が指す Blob Storage 上の画像も削除します。
        画像の削除に失敗した場合はログ出力のみで、ドキュメント削除は成功として 200 を返します。
      tags:
        - Plants
      parameters:
        - name: id
          in: path
          required: true
          description: 植物ID (UUID)
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/FunctionKey'
      responses:
        '200':
          description: 植物の削除成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "植物が正常に削除されました"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlantNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

  /plants/identify:
    post:
      summary: 植物識別実行
      description: |
        既にアップロード済みの画像URLとコンテキスト情報から植物を識別します。
        画像が植物でない場合もエラーにはならず、`isPlant: false` として 200 で返ります。
      tags:
        - Plants
      parameters:
        - $ref: '#/components/parameters/FunctionKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifyRequest'
      responses:
        '200':
          description: 植物識別の実行成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/IdentificationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/AIServiceError'
        '503':
          $ref: '#/components/responses/AIServiceUnavailable'

  /plants/check-duplicate:
    get:
      summary: 重複確認
      description: 同名の植物が既に登録されているかチェック
      tags:
        - Plants
      parameters:
        - name: name
          in: query
          required: true
          description: 植物名
          schema:
            type: string
          example: "桜"
        - $ref: '#/components/parameters/FunctionKey'
      responses:
        '200':
          description: 重複確認の実行成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/DuplicateCheckResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

  /images/upload:
    post:
      summary: 画像アップロード・植物判定統合
      description: |
        画像を一時コンテナに保存してAI識別を実行し、結果によって保存先を振り分けます。

        1. 画像を一時コンテナへ保存（SASトークン付きURL）
        2. AIで植物判定・識別を実行
        3. 植物でなければ一時ファイルを削除し `NOT_A_PLANT` (400) を返す
        4. 植物なら永続コンテナへ移動し、公開URLと識別候補を返す
      tags:
        - Images
      parameters:
        - $ref: '#/components/parameters/FunctionKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: 画像ファイル (JPEG, PNG, WebP, GIF)
                contextInfo:
                  type: string
                  maxLength: 500
                  description: |
                    撮影場所や環境情報（任意）。
                    テキストフィールド以外（ファイルとして送られた場合など）は
                    400 `INVALID_REQUEST`（message: 補足情報は文字列で指定してください）。
                    上限を超えると 400 `INVALID_REQUEST`
                    （message: 補足情報は500文字以内で指定してください）。
                    いずれも一時保存とAI呼び出しの前に弾かれる。
                    上限値は環境変数 `CONTEXT_INFO_MAX_LENGTH` で変更可能（既定 500。
                    正の整数として読めない値なら既定値が使われる）。
                  example: "〇〇山の標高1300m、日当たりの良い場所"
      responses:
        '201':
          description: 画像アップロードと植物識別の成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      imagePath:
                        type: string
                        format: uri
                        description: 永続コンテナへ保存された画像の公開URL
                        example: "https://stsnaplant.blob.core.windows.net/images/12345678-uuid.jpg"
                      fileName:
                        type: string
                        description: |
                          クライアントが送信したファイル名をそのまま返す。
                          Blob 名は UUID + 検証済み Content-Type から決めた拡張子なので、
                          `imagePath` 末尾のファイル名とは一致しない。
                        example: "plant_image.jpg"
                      contentType:
                        type: string
                        example: "image/jpeg"
                      fileSize:
                        type: integer
                        description: ファイルサイズ（バイト）
                        example: 1048576
                      identificationResult:
                        type: object
                        properties:
                          isPlant:
                            type: boolean
                            example: true
                          confidence:
                            type: number
                            description: 植物判定の信頼度 (0-100)
                            example: 95
                          candidates:
                            type: array
                            description: 信頼度降順の候補（最大3件）
                            items:
                              $ref: '#/components/schemas/PlantCandidate'
        '400':
          description: リクエスト不正、または植物でない画像
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_a_plant:
                  summary: 植物が写っていない
                  value:
                    success: false
                    error:
                      code: "NOT_A_PLANT"
                      message: "アップロードされた画像は植物ではありません"
                      details: "植物の画像を選択して再度お試しください"
                invalid_request:
                  summary: ファイル未指定など
                  value:
                    success: false
                    error:
                      code: "INVALID_REQUEST"
                      message: "画像ファイルが指定されていません"
                      details: "imageフィールドでファイルを送信してください"
                context_info_too_long:
                  summary: 補足情報が長すぎる
                  value:
                    success: false
                    error:
                      code: "INVALID_REQUEST"
                      message: "補足情報は500文字以内で指定してください"
                context_info_not_a_string:
                  summary: 補足情報が文字列でない
                  value:
                    success: false
                    error:
                      code: "INVALID_REQUEST"
                      message: "補足情報は文字列で指定してください"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/FileTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: |
            上流サービスがエラー応答を返した。このエンドポイントでは2種類ある。

            - `AI_SERVICE_ERROR`: AI識別の呼び出しが失敗した
            - `STORAGE_ERROR`: Blob Storage の操作が失敗した（接続自体はできている）

            接続できない場合（`ENOTFOUND` / `ECONNREFUSED` / `ETIMEDOUT`）は
            502 ではなく 503 `STORAGE_ERROR` になる。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ai:
                  summary: AI識別サービスのエラー応答
                  value:
                    success: false
                    error:
                      code: "AI_SERVICE_ERROR"
                      message: "植物識別サービスでエラーが発生しました"
                storage:
                  summary: ストレージのエラー応答
                  value:
                    success: false
                    error:
                      code: "STORAGE_ERROR"
                      message: "ストレージサービスでエラーが発生しました"
        '503':
          $ref: '#/components/responses/StorageUnavailable'


components:
  securitySchemes:
    FunctionKey:
      type: apiKey
      in: query
      name: code
      description: Azure Function Key for API authentication

  parameters:
    FunctionKey:
      name: code
      in: query
      required: true
      description: Azure Function Key for API authentication
      schema:
        type: string
      example: "your-function-key-here"

  schemas:
    Plant:
      type: object
      required:
        - id
        - name
        - characteristics
        - confidence
        - imagePath
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: 植物ID
        name:
          type: string
          description: 植物名
          example: "桜"
        scientificName:
          type: string
          nullable: true
          description: 学名
          example: "Prunus serrulata"
        familyName:
          type: string
          nullable: true
          description: 科名
          example: "バラ科"
        description:
          type: string
          nullable: true
          description: 詳細説明
          example: "日本を代表する花木で、春に美しい花を咲かせる。"
        characteristics:
          type: string
          description: 特徴（画面表示用）
          example: "春に美しいピンクの花を咲かせる"
        confidence:
          type: number
          minimum: 0
          maximum: 100
          description: AI識別の信頼度
          example: 95.5
        imagePath:
          type: string
          format: uri
          description: 画像URL
          example: "https://snaplant.blob.core.windows.net/images/sakura.jpg"
        createdAt:
          type: string
          format: date-time
          description: 作成日時
        updatedAt:
          type: string
          format: date-time
          description: 更新日時

    PlantSummary:
      type: object
      required:
        - id
        - name
        - characteristics
        - imagePath
        - confidence
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: 植物ID
        name:
          type: string
          description: 植物名
          example: "桜"
        characteristics:
          type: string
          description: 特徴
          example: "春に美しいピンクの花を咲かせる"
        imagePath:
          type: string
          format: uri
          description: 画像URL
        confidence:
          type: number
          minimum: 0
          maximum: 100
          description: AI識別の信頼度
        createdAt:
          type: string
          format: date-time
          description: 作成日時

    PlantCreateRequest:
      type: object
      required:
        - name
        - characteristics
        - confidence
        - imagePath
      properties:
        name:
          type: string
          description: 植物名
          example: "桜"
        scientificName:
          type: string
          nullable: true
          description: 学名
          example: "Prunus serrulata"
        familyName:
          type: string
          nullable: true
          description: 科名
          example: "バラ科"
        description:
          type: string
          nullable: true
          description: 詳細説明
        characteristics:
          type: string
          description: 特徴
          example: "春に美しいピンクの花を咲かせる"
        confidence:
          type: number
          minimum: 0
          maximum: 100
          description: AI識別の信頼度
        imagePath:
          type: string
          format: uri
          description: |
            `POST /images/upload` が返した `imagePath` を指定する。
            次のすべてを満たさないURLは 400 `INVALID_REQUEST`
            （message: 画像アップロードAPIが返したURLを指定してください）。

            - スキームが `https:`（`http:` やその他のスキームは不可）
            - ホストが自ストレージアカウントのBlobエンドポイント（外部ホストは不可）
            - パスがちょうど `/<永続コンテナ名>/<Blob名>` の2セグメント
              （一時コンテナ、中間に余分なセグメントを挟んだURL、コンテナまでしか
              指していないURLはいずれも不可）
            - 文字列が `https://<ホスト>/<永続コンテナ名>/<Blob名>` と完全一致すること。
              同じBlobを指す別表記は不可（クエリ文字列、フラグメント、
              `user:pass@` の認証情報、ホスト名の大文字、先頭の空白など）。
              保存されるのは正規化後のURLではなく送られた文字列そのものであり、
              表記違いが混ざると `imagePath` の完全一致に頼る重複チェックと
              旧画像削除の判定が誤作動する

            同じ `imagePath` のレコードが既にある場合は 409 `IMAGE_ALREADY_SAVED`。

    PlantUpdateRequest:
      type: object
      required:
        - imagePath
        - confidence
      properties:
        imagePath:
          type: string
          format: uri
          description: |
            新しい画像URL。`POST /images/upload` が返した `imagePath` を指定する。
            制約は `PlantCreateRequest.imagePath` と同じで、`https:` スキーム・
            自ストレージアカウントのBlobエンドポイント・ちょうど
            `/<永続コンテナ名>/<Blob名>` の2セグメント・正規形との文字列完全一致の
            すべてを満たす必要がある。
            満たさない場合は 400 `INVALID_REQUEST`
            （message: 画像アップロードAPIが返したURLを指定してください）。
            旧画像の削除が発火するため、保存前にスキーム・ホスト・パスの形を検証している。
            同じ画像のレコードがあり、そのどれも更新対象自身でない場合は 409 `IMAGE_ALREADY_SAVED`
            （`PUT /plants/{id}` の 409 を参照）。
        confidence:
          type: number
          minimum: 0
          maximum: 100
          description: 新しい信頼度

    IdentifyRequest:
      type: object
      required:
        - imagePath
      properties:
        imagePath:
          type: string
          format: uri
          description: |
            識別対象の画像URL。URLとしてパースできれば受け付ける
            （`PlantCreateRequest.imagePath` のようなスキーム・ホスト・パス形の制約は
            このエンドポイントでは適用されない）。指定されたURLはそのままAI識別サービスへ渡される。
          example: "https://stsnaplant.blob.core.windows.net/temp-images/12345678-uuid.jpg?sv=...&sig=..."
        contextInfo:
          type: string
          nullable: true
          maxLength: 500
          description: |
            撮影場所や環境情報（任意）。
            文字列以外（数値、配列、オブジェクトなど）を指定すると
            400 `INVALID_REQUEST`（message: 補足情報は文字列で指定してください）。
            上限を超えると 400 `INVALID_REQUEST`（message: 補足情報は500文字以内で指定してください）。
            上限値は環境変数 `CONTEXT_INFO_MAX_LENGTH` で変更可能（既定 500。
            正の整数として読めない値なら既定値が使われる）。
            `null` と未指定は「補足情報なし」として扱う。
          example: "〇〇山の標高1300m、日当たりの良い場所"

    IdentificationResult:
      type: object
      required:
        - isPlant
        - candidates
      properties:
        isPlant:
          type: boolean
          description: 画像に植物が写っているか
          example: true
        confidence:
          type: number
          minimum: 0
          maximum: 100
          description: 植物判定の信頼度
          example: 95.5
        reason:
          type: string
          description: 判定理由（日本語）
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/PlantCandidate'
          maxItems: 3
          description: |
            識別候補（信頼度降順）。`isPlant: false` の場合は空配列。
            上限3件はプロンプトで担保しており、スキーマ側では強制されない。

    PlantCandidate:
      type: object
      required:
        - name
        - characteristics
        - confidence
      properties:
        name:
          type: string
          description: 植物名
          example: "桜"
        scientificName:
          type: string
          nullable: true
          description: 学名
          example: "Prunus serrulata"
        familyName:
          type: string
          nullable: true
          description: 科名
          example: "バラ科"
        description:
          type: string
          nullable: true
          description: 詳細説明
        characteristics:
          type: string
          description: 特徴
          example: "春に美しいピンクの花を咲かせる"
        confidence:
          type: number
          minimum: 0
          maximum: 100
          description: AI識別の信頼度
          example: 95.5

    DuplicateCheckResult:
      type: object
      required:
        - exists
      properties:
        exists:
          type: boolean
          description: 同名植物の存在有無
        plant:
          type: object
          nullable: true
          description: 存在する場合の植物情報
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            imagePath:
              type: string
              format: uri
            confidence:
              type: number
              minimum: 0
              maximum: 100
            createdAt:
              type: string
              format: date-time

    Error:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum: [false]
          description: 失敗時は常に false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: エラーコード
            message:
              type: string
              description: エラーメッセージ（日本語）
            details:
              type: string
              nullable: true
              description: 詳細情報

  responses:
    BadRequest:
      description: |
        リクエスト形式が不正。`code` は常に `INVALID_REQUEST` で、
        `message` は検証に失敗した項目ごとに異なる（下は代表例）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_uuid:
              summary: 植物IDがUUID形式でない
              value:
                success: false
                error:
                  code: "INVALID_REQUEST"
                  message: "植物IDの形式が無効です"
                  details: "UUID形式で指定してください"
            image_path_not_allowed:
              summary: imagePath がアップロードAPIの返却URLでない
              value:
                success: false
                error:
                  code: "INVALID_REQUEST"
                  message: "画像アップロードAPIが返したURLを指定してください"
            malformed_json:
              summary: ボディがJSONとしてパースできない
              value:
                success: false
                error:
                  code: "INVALID_REQUEST"
                  message: "リクエストボディの形式が無効です"
                  details: "JSON形式で送信してください"

    Unauthorized:
      description: |
        Function Key認証エラー。
        注: この応答は Azure Functions ランタイムが返すため、
        アプリケーション側の共通封筒形式にはなりません。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing_key:
              summary: APIキーが未指定
              value:
                success: false
                error:
                  code: "UNAUTHORIZED"
                  message: "APIキーが指定されていません"
            invalid_key:
              summary: APIキーが無効
              value:
                success: false
                error:
                  code: "INVALID_API_KEY"
                  message: "APIキーが無効または期限切れです"

    PlantNotFound:
      description: 植物が見つからない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: "PLANT_NOT_FOUND"
              message: "指定された植物が見つかりません"

    Conflict:
      description: |
        保存時の競合。2種類ある。

        - `IMAGE_ALREADY_SAVED`: 同じ `imagePath` のレコードが既に存在する（`details` なし）
        - `DATABASE_ERROR`: Cosmos DB が 409 を返した
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            image_already_saved:
              summary: 同じ画像が既に保存されている
              value:
                success: false
                error:
                  code: "IMAGE_ALREADY_SAVED"
                  message: "この画像は既に保存されています"
            database_error:
              summary: Cosmos DB の競合
              value:
                success: false
                error:
                  code: "DATABASE_ERROR"
                  message: "植物の保存に失敗しました"

    FileTooLarge:
      description: |
        ファイルサイズ超過。上限は環境変数 `MAX_FILE_SIZE`（既定 10485760 = 10MB）で、
        `details` のメッセージも同じ値から生成される。
        正の整数として読めない値を設定した場合は既定値が使われる。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: "FILE_TOO_LARGE"
              message: "ファイルサイズが大きすぎます"
              details: "ファイルサイズは10MB以下にしてください"

    UnsupportedMediaType:
      description: サポートされていない画像形式（JPEG / PNG / WebP / GIF 以外）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: "UNSUPPORTED_MEDIA_TYPE"
              message: "サポートされていない画像形式です"
              details: "JPEG、PNG、WebP、GIFファイルのみアップロード可能です"

    AIServiceError:
      description: AI識別サービスエラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: "AI_SERVICE_ERROR"
              message: "植物識別サービスでエラーが発生しました"

    DatabaseUnavailable:
      description: |
        Cosmos DB へ接続できない（接続時の `ENOTFOUND` / `ECONNREFUSED`）。

        エラーコードはエンドポイントごとに1種類しか出ない。Cosmos DB を使う
        エンドポイントは `DATABASE_ERROR` だけを返す。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: "DATABASE_ERROR"
              message: "データベースに接続できません"

    StorageUnavailable:
      description: |
        Blob Storage へ接続できない（`ENOTFOUND` / `ECONNREFUSED` / `ETIMEDOUT`）。

        `POST /images/upload` のネットワーク起因の失敗はすべてこのコードになる。
        `ETIMEDOUT` を 503 に分類するのはこのエンドポイントだけで、
        他のエンドポイントは `ENOTFOUND` / `ECONNREFUSED` のみを見る。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: "STORAGE_ERROR"
              message: "ストレージサービスに接続できません"

    AIServiceUnavailable:
      description: |
        AI識別サービスへ接続できない（`ENOTFOUND` / `ECONNREFUSED`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: "AI_SERVICE_ERROR"
              message: "植物識別サービスに接続できません"

    InternalError:
      description: サーバー内部エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: "INTERNAL_ERROR"
              message: "サーバー内部エラーが発生しました"
