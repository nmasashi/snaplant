openapi: 3.0.3
info:
  title: SnapPlant API
  description: |
    SnapPlant の REST API 仕様書。

    今あるエンドポイント（旅行アルバムと図鑑）は、まだこの仕様書に書いていない（`docs/09_backlog.md` の
    「OpenAPI 仕様書にエンドポイントが無い」）。
    ルート・リクエスト・応答・エラーの文言は `docs/05_api_design.md` を参照。
    共通事項（認証・応答の封筒・エラーの分類）は `docs/05_api_design.md` §9。

    植物図鑑の API（`/plants`・`/plants/{id}`・`/plants/save`・`/plants/identify`・
    `/plants/check-duplicate`・`/images/upload`）は 4-6 で削除した。関数が登録されていないので、呼ぶと 404 になる。
  version: 1.0.0
  contact:
    name: SnapPlant Development Team
  license:
    name: MIT

servers:
  - url: https://func-snaplant-mk0w7s38.azurewebsites.net/api
    description: Production server (West Europe)

security:
  - FunctionKey: []

# エンドポイントは docs/05_api_design.md にあり、まだここに書いていない（info.description）
paths: {}

components:
  securitySchemes:
    FunctionKey:
      type: apiKey
      in: query
      name: code
      description: Azure Function Key for API authentication

  parameters:
    FunctionKey:
      name: code
      in: query
      required: true
      description: Azure Function Key for API authentication
      schema:
        type: string
      example: "your-function-key-here"

  schemas:
    Error:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum: [false]
          description: 失敗時は常に false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: エラーコード（契約。クライアントは分岐に使ってよい）
            message:
              type: string
              description: |
                エラーメッセージ（日本語）。契約で、文言は各エンドポイントの仕様に記載する。
                Flutter クライアントは 400 などでこの文言をそのまま画面に表示する。
            details:
              type: string
              nullable: true
              description: |
                詳細情報。**契約外**で、文言を保証しない。
                500 `INTERNAL_ERROR`・502・503 では、サーバ内部で発生した
                例外のメッセージがそのまま入る（SDK 由来の英語のメッセージや、内部で包み直した
                「〜に失敗しました: <元のメッセージ>」の形など）。
                内容は安定しないので、クライアントは表示や分岐に使わないこと。

  responses:
    Unauthorized:
      description: |
        Function Key認証エラー（`code` が未指定・無効）。
        この応答は Azure Functions ランタイムが返し、アプリケーションコードに到達しないため、
        `{ success, error }` の封筒にならず、`code` / `message` も無い。
        アプリケーションの `ErrorCode` にも対応する値は無い（以前の `UNAUTHORIZED` /
        `INVALID_API_KEY` は生成箇所が無いため削除済み。`05_api_design.md` §9.3）。
