name: snaplant_mobile
description: SnapPlant 植物図鑑モバイルアプリ

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  # 状態管理は setState、画面遷移は Navigator.push、HTTP は http を使う（CLAUDE.md「実装の慣習」）。
  # 使わないパッケージは宣言しない
  flutter:
    sdk: flutter

  # UI & Material Design
  cupertino_icons: ^1.0.6

  # HTTP通信
  http: ^1.2.0
  http_parser: ^4.1.2

  # 画像処理
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  # 写真用に上限を上げたキャッシュ（lib/utils/photo_cache_manager.dart）。cached_network_image が使うものと同じ
  flutter_cache_manager: ^3.4.1

  # データ保存
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.7
  exif: ^3.3.0
  flutter_image_compress: ^2.5.1
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_secure_storage_platform_interface: ^1.1.2
  flutter_lints: ^3.0.1

  # ギャラリー（OS の画像選択）をテストで偽物に差し替えるため
  image_picker_platform_interface: ^2.10.1
  plugin_platform_interface: ^2.1.8

  # 端末の Geocoder（地名への変換）をテストで偽物に差し替えるため
  geocoding_platform_interface: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
  #       - asset: fonts/Roboto-Medium.ttf
  #         weight: 500
  #       - asset: fonts/Roboto-Bold.ttf
  #         weight: 700
