name: Flutter

# mobile/ の静的解析とテスト。
#
# ci.yml とは別のワークフローにしている（deploy-functions.yml が ci.yml の成功をデプロイの前提にしており、
# mobile/ は本番デプロイと関係が無いため）。flutter analyze は info も含めて指摘があれば失敗する。
# 指摘は 2026-10-12 に0件にした（#24）。continue-on-error で失敗を握りつぶさないこと（CLAUDE.md「CI/CD」）。

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # 手元（Windows）と同じ版にそろえる。版を上げるときは手元と一緒に上げる
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.8'
        channel: stable
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Analyze
      run: flutter analyze

    # 端末の時刻に直して出す日時のテストは、日本時間で動くことを前提にする（CLAUDE.md。写真の撮影日時は変換しない）
    - name: Test
      run: flutter test
      env:
        TZ: Asia/Tokyo
